<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cash POS">
<meta name="theme-color" content="#ffffff">
<title>Dakabin Cash POS</title>
<style>
:root{--bg:#f4f5f6;--panel:#fff;--ink:#1a1d21;--mute:#666d75;--line:#e2e4e7;--blue:#006aff;--red:#cf3021;--green:#13834f;--grey:#e9ebee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.hidden{display:none!important}
#app{height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.mute{color:var(--mute)}
.link{color:var(--blue);font-weight:600}
h2.ttl{font-size:26px;margin:4px 0 18px}
/* till */
.till{display:grid;grid-template-columns:1fr minmax(320px,31%);grid-template-rows:minmax(0,1fr) auto;height:100%}
.main{overflow-y:auto;padding:20px 22px 30px;-webkit-overflow-scrolling:touch;min-height:0}
.bill{grid-row:1/3;grid-column:2;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.nav{grid-column:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.nav button{padding:11px 16px;border-radius:999px;font-weight:600;color:#3b4148}
.nav button.on{background:var(--grey);color:var(--ink)}
.nav .who{margin-left:auto;font-size:14px;color:var(--mute);white-space:nowrap}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.crumb{flex:1;font-size:22px;font-weight:600;color:var(--mute);display:flex;gap:10px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);border-bottom:3px solid var(--ink);padding-bottom:3px}
.round{width:52px;height:52px;border-radius:50%;background:var(--grey);display:grid;place-items:center;flex:none;font-size:22px;text-align:center}
.search{width:220px;padding:13px 16px;border-radius:999px;border:0;background:var(--grey);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{position:relative;min-height:118px;border-radius:8px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;font-weight:600;font-size:19px;line-height:1.2;transition:transform .08s;overflow-wrap:anywhere}
.tile:active{transform:scale(.97)}
.tile .sub{font-weight:400;font-size:15px}
.tile.cat{color:#fff}
.tile.cat .sub{opacity:.92}
.tile.small{min-height:76px;background:var(--grey);font-weight:500}
.tile .ico{position:absolute;top:12px;left:14px;width:18px;height:18px;opacity:.9}
.grid.dense .tile{min-height:66px;justify-content:center;font-size:17px;padding:10px 14px}
.grid.dense .tile .sub{font-size:14px}
.billspace{flex:1}
.grid.sq{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:var(--rh,78px);gap:10px;align-items:stretch}
.grid.sq .tile{min-height:0;padding:10px 14px;overflow:hidden}
.grid.sq .tile.sm{padding:6px 12px;justify-content:center;font-size:16px;line-height:1.15}
.grid.sq .tile .sub{font-size:14px}
@media (max-width:1000px) and (min-width:601px){.grid.sq{--rh:60px;gap:8px}.grid.sq .tile{padding:7px 9px;font-size:14px}.grid.sq .tile.sm{font-size:13px;padding:4px 8px}.grid.sq .tile .sub{font-size:12px}}
.cartbar{display:none}
.phoneonly{display:none}
.billhead{padding-bottom:4px}
.billtab{display:flex;gap:20px;padding:0 20px;border-bottom:1px solid var(--line);margin-bottom:12px}
.billtab span{padding:8px 0;font-weight:700;font-size:18px;color:var(--mute)}
.billtab span.on{color:var(--ink);border-bottom:3px solid var(--ink)}
.bbox{border:1px solid var(--line);border-radius:10px;padding:2px 14px}
.bbox.empty{padding:14px}
.bline{display:grid;grid-template-columns:1fr auto auto;gap:10px;border-bottom:1px solid var(--line)}
.bbox .bline:last-child{border-bottom:0}
.bq{color:var(--mute);min-width:24px;text-align:right}.bp{min-width:62px;text-align:right}
.totals{border:1px solid var(--line);border-radius:10px;margin:10px 20px 0}
.btn.paybtn{background:#15192b;color:#fff}
.btn.paybtn:disabled{background:#e9ebee;color:#3b4148;opacity:1}
.billhead{padding:20px 20px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.billhead h2{margin:0;font-size:28px}
.sync{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--grey);white-space:nowrap}
.sync.ok{background:#e3f4ea;color:var(--green)}
.sync.err,.sync.offline{background:#fde8e6;color:var(--red)}
.lines{flex:0 1 auto;overflow-y:auto;padding:0 20px;min-height:0}
.empty{border:1px solid var(--line);border-radius:8px;padding:16px}
.bline{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;font-weight:500}
.qty{color:var(--mute);font-weight:400}
.totals{border:1px solid var(--line);border-radius:8px;margin:12px 20px;padding:4px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0}
.row.big{font-weight:700;font-size:19px}
.billact{display:flex;gap:8px;padding:0 20px 10px}
.billact .btn{flex:1}
.btn{display:inline-block;padding:14px 18px;border-radius:999px;background:var(--grey);font-weight:600;text-align:center}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{background:#fde8e6;color:var(--red)}
.btn.block{display:block;width:100%}
.pay{margin:0 20px 20px;padding:20px;font-size:20px}
/* lists */
.stack{display:flex;flex-direction:column;gap:10px;max-width:640px}
.mi{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer}
.mi span{color:var(--mute);font-size:14px}
.lst{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.lst .it{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-bottom:1px solid var(--line)}
.lst .it:last-child{border-bottom:0}
.lst .it .grow{flex:1;min-width:0}
.lst .it small{display:block;color:var(--mute)}
.lst h5{margin:0;padding:10px 16px;background:#f7f8f9;font-size:14px;color:var(--mute);border-bottom:1px solid var(--line)}
.sw{width:22px;height:22px;border-radius:6px;flex:none}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#fde8e6;color:var(--red)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 0 18px}
.tabs button{flex:1;padding:12px 4px;font-weight:600;color:#3b4148;border-bottom:3px solid transparent;text-align:center}
.tabs button.on{border-color:var(--ink);color:var(--ink)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,22,26,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:#fff;border-radius:16px;width:min(540px,100%);max-height:94vh;overflow-y:auto;padding:22px}
.sheet h3{margin:0 0 12px;font-size:22px}
.mrow{display:flex;gap:10px;margin-top:16px}
.mrow .btn{flex:1}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kp button{height:60px;border-radius:12px;background:var(--grey);font-size:24px;font-weight:600;text-align:center}
.disp{font-size:42px;font-weight:700;text-align:center;padding:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:12px 16px;border-radius:999px;background:var(--grey);font-weight:600}
.chip.on{background:var(--ink);color:#fff}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.field input,.field select{width:100%;padding:12px;border:1px solid #cfd3d8;border-radius:8px;background:#fff;font-size:17px}
.vrow{display:flex;gap:8px;margin-bottom:8px}
.vrow input{flex:1;min-width:0;padding:12px;border:1px solid #cfd3d8;border-radius:8px;font-size:17px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--grey);font-size:22px;font-weight:700;text-align:center}
.change{font-size:56px;font-weight:800;text-align:center;margin:10px 0 4px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:60;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
/* login / setup */
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.brand{font-size:30px;font-weight:800;letter-spacing:-.02em}
.dots{display:flex;gap:16px;margin:20px 0;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,80px);gap:14px;justify-content:center}
.pinpad button{height:80px;border-radius:50%;background:#fff;font-size:30px;font-weight:500;box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.pinpad.sm{grid-template-columns:repeat(3,68px)}
.pinpad.sm button{height:68px;font-size:26px}
.form{width:min(560px,100%);padding:10px 0 40px}
.form h1{font-size:28px;margin:0 0 6px}
.form h4{margin:22px 0 10px;font-size:17px}
/* reports */
.rep{max-width:760px;margin:0 auto}
.rephead{text-align:center;background:#eef0f2;padding:10px;border-radius:8px;margin-bottom:6px}
.rephead .d{color:var(--blue);font-weight:700;font-size:20px}
.rephead .v{color:var(--mute);font-size:14px}
.sec{margin:26px 0}
.sec h4{margin:0 0 12px;font-size:15px;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.kpi{padding:14px 0;border-bottom:1px solid #cfd3d8}
.kpi .n{font-size:30px;font-weight:500;letter-spacing:-.01em}
.kpi .l{color:var(--mute)}
.kpi .c{font-weight:700;font-size:14px;margin-top:2px}
.up{color:var(--green)}.down{color:var(--red)}
.seg{display:flex;border:1px solid #323a43;border-radius:4px;overflow:hidden;margin-bottom:6px}
.seg button{flex:1;padding:10px;font-weight:600;text-align:center}
.seg button.on{background:#323a43;color:#fff}
.li{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.cmp b{display:block;font-size:20px}
.cmp .cur b{color:var(--blue)}
.chart{width:100%;height:auto;display:block}
.viewer{height:100%;overflow-y:auto;padding:14px 16px 40px;max-width:860px;margin:0 auto}
.vhead{flex-wrap:wrap}
.vhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.vhead .t{flex:1;font-weight:800;font-size:20px}
#printArea{display:none}
@media print{body>*{display:none!important}#printArea{display:block!important}#printArea pre{font:12px/1.3 Menlo,monospace;margin:0}}
@media (max-width:1000px) and (min-width:601px){
 .till{grid-template-columns:minmax(0,1fr) 270px}
 .main{padding:12px 14px 20px}
 .topbar{margin-bottom:10px;gap:8px}.round{width:40px;height:40px;font-size:18px}
 .crumb{font-size:16px;text-overflow:ellipsis}.search{width:130px;padding:9px 12px;font-size:15px}
 .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 .tile{min-height:80px;font-size:15px;padding:10px}.tile .sub{font-size:13px}.tile .ico{top:8px;left:10px;width:15px;height:15px}
 .grid.dense .tile{min-height:50px;font-size:14px;padding:8px 10px}
 .nav{gap:0;padding:4px 6px}.nav button{padding:8px 10px;font-size:14px}.nav .who{font-size:12px}
 .billhead{padding:10px 14px 4px}.billhead h2{font-size:20px}.sync{font-size:11px;padding:3px 7px}
 .lines{padding:0 14px}.bline{padding:8px 0;font-size:14px}.empty{padding:10px;font-size:14px}
 .totals{margin:8px 14px;padding:2px 12px;font-size:14px}.row{padding:5px 0}.row.big{font-size:16px}
 .billact{padding:0 14px 6px;gap:6px}.billact .btn{padding:9px 10px;font-size:14px}.pay{margin:0 14px 10px;padding:13px;font-size:16px}
}
.main{min-width:0}
@media (max-width:600px){
 .till{display:flex;flex-direction:column;height:100%}
 .main{flex:1 1 auto;min-height:0;min-width:0;padding:12px 14px 16px;overflow-x:hidden}
 .topbar{flex-wrap:wrap;gap:8px;margin-bottom:12px}
 .crumb{font-size:20px;min-width:0}
 .round+.crumb>span{display:none}
 .search{width:100%;order:3;padding:11px 14px}
 .round{width:44px;height:44px}
 h2.ttl{font-size:22px;margin:2px 0 12px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .tile{min-height:96px;font-size:17px;padding:12px}
 .tile .ico{top:10px;left:12px}
 .grid.dense .tile{min-height:60px;font-size:15px;padding:8px 12px}
 .cartbar{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);flex:none}
 .cartview{flex:1;display:flex;flex-direction:column;align-items:flex-start;padding:4px 6px;min-width:0}
 .cartview b{font-size:17px}.cartview span{color:var(--mute);font-size:13px}
 .cartpay{min-width:120px;padding:14px 18px}
 .nav{justify-content:space-between;padding:4px;overflow-x:auto;flex:none}
 .nav button{padding:10px 4px;font-size:13px;flex:1;text-align:center;white-space:nowrap}
 .nav .who{display:none}
 .bill{display:none}
 .bill.open{display:flex;position:fixed;left:0;right:0;bottom:0;top:10dvh;border:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
 .bill .lines{flex:1 1 auto}
 .phoneonly{display:inline-block;padding:8px 16px}
 .billhead{flex-wrap:nowrap;align-items:center;gap:8px;padding:16px 16px 4px}
 .billhead h2{font-size:22px;white-space:nowrap;margin-right:auto}
 .billhead .sync{font-size:11px;padding:4px 8px}
 .billtab{padding:0 16px}
 .bill .lines,.bill .billact{padding-left:16px;padding-right:16px}
 .bill .totals{margin-left:16px;margin-right:16px}
 .bill .pay{margin:0 16px 14px}
 .kpi .n{font-size:24px}
 .sheet{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
'use strict';
const VERSION='2.9.2';
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const hashPin=p=>{let x=2166136261>>>0;const s='dakabin-cashpos|'+p;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)>>>0}return x.toString(16)};
const fmtT=d=>new Date(d).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});

const fmtD=d=>new Date(d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
const fmtDs=d=>new Date(d).toLocaleDateString('en-AU',{day:'numeric',month:'short'});
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

const hexA=(hex,a)=>{const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return '#e9ebee';const n=parseInt(m[1],16);const mix=v=>Math.round(v*a+255*(1-a));return `rgb(${mix(n>>16&255)},${mix(n>>8&255)},${mix(n&255)})`};

const needsAdminSync=s=>new Date(s.at)<sod(new Date())&&(s.syncedRev||0)>0;
async function syncNow(){
 if(!cfg||!cfg.sbUrl||!cfg.sbKey){syncState='off';updSync();return}
 if(cfg.mode==='viewer'){
  if(!ADMIN||syncing)return;syncing=true;let err=null;
  try{
   await pushDirtyKV();
   if(V.kvOk&&await pullKV()&&!MODAL&&['items','staff'].includes(V.screen))render();
  }catch(e){err=e}
  syncState=err?(navigator.onLine?'err':'offline'):'ok';syncErr=err?err.message:'';syncing=false;updSync();return;
 }
 if(!TILL){syncState='err';syncErr='This iPad is not connected as the till';updSync();return}
 if(syncing)return;syncing=true;const errs=[];
 const step=async f=>{try{await f()}catch(e){errs.push(e)}};
 const t0=sod(new Date()),pend=pending();
 await step(()=>pushSales(pend.filter(s=>new Date(s.at)>=t0),'till',true));
 await step(()=>pushSales(pend.filter(s=>new Date(s.at)<t0&&!((s.syncedRev||0)>0)),'till',false));
 if(ADMIN){
  await step(()=>pushSales(pend.filter(needsAdminSync),'admin',true));
  await step(()=>pushDirtyKV());
 }
 let changed=false;await step(async()=>{changed=await pullKV()});
 if(errs.length){syncState=navigator.onLine?'err':'offline';syncErr=errs[0].message;console.warn(errs)}else{syncState='ok';syncErr=''}
 if(changed&&!MODAL&&(!user||V.screen==='menu'))render();
 syncing=false;updSync();
}

 if(syncState==='err')return 'Sync problem, tap';
 if((dirty.catalog||dirty.staff||dirty.settings)&&ADMIN)return 'Saving changes…';
 if(q&&adm&&!ADMIN&&adm>=q)return `${q} waiting for admin`;

function receiptLines(s,refund){
 const W=cfg.cols||42,L=[],add=(text,o={})=>L.push({text:String(text??''),...o});
 const lr=(a,b)=>{a=String(a);b=String(b);const room=W-b.length-1;if(a.length>room)a=a.slice(0,Math.max(room,1));return a+' '.repeat(Math.max(1,W-a.length-b.length))+b};
 const rule='-'.repeat(W);
 add(cfg.biz||'Dakabin Bakehouse',{align:'center',bold:true,big:true});
 if(cfg.addr)add(cfg.addr,{align:'center'});
 if(cfg.phone)add('Ph '+cfg.phone,{align:'center'});
 add('ABN '+(cfg.abn||DEFAULT_ABN),{align:'center'});
 add('');
 if(refund){
  add('REFUND',{align:'center',bold:true,big:true});
  add(lr('Original receipt',s.no));add(lr('Refunded',fmtDT(refund.at)));add(lr('Approved by',refund.byName));add(rule);
  refund.lines.forEach(rl=>{const l=s.lines[rl.idx];add(lr(`${rl.qty} x ${l.name}`,money(l.price*rl.qty)))});
  add(rule);add(lr('CASH REFUNDED',money(refund.amount)),{bold:true});
  if(refund.reason)add('Reason: '+refund.reason);
 }else{
  if(s.total>=8250)add('TAX INVOICE',{align:'center',bold:true});
  add(lr('Receipt '+s.no,fmtDT(s.at)));add('Served by '+s.staffName);add(rule);
  s.lines.forEach(l=>add(lr(`${l.qty} x ${l.name}`,money(l.price*l.qty))));
  add(rule);add(lr('Subtotal',money(s.subtotal)));
  if(s.discount)add(lr(s.discount.auto?`Cash discount ${s.discount.value}%`:'Discount',money(-s.discount.amount)));
  if(s.rounding)add(lr('Cash rounding',money(s.rounding)));
  add(lr('TOTAL',money(s.total)),{bold:true});if(s.gst)add(lr('GST included in price',money(s.gst)));add(lr('Cash',money(s.tendered)));add(lr('Change',money(s.change)));
  if(s.refunded)add(lr('Refunded since',money(-s.refunded)));
 }
 add('');add(cfg.footer||'Thank you! See you soon.',{align:'center'});
 return L;
}
function eposXml(lines,kick,cut=true){
 let b='<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">';
 for(const l of lines){b+=`<text align="${l.align||'left'}"/><text em="${l.bold?'true':'false'}"/><text width="${l.big?2:1}" height="${l.big?2:1}"/><text>${h(l.text)}&#10;</text>`}
 if(cut)b+='<feed line="3"/><cut type="feed"/>';
 if(kick)b+='<pulse drawer="drawer_1" time="pulse_100"/>';
 b+='</epos-print>';
 return `<?xml version="1.0" encoding="utf-8"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body>${b}</s:Body></s:Envelope>`;
}
function eposBase(port){return `${cfg.printerHttps?'https':'http'}://${cfg.printerIp}${port?':'+port:''}`}
async function sendEpos(xml,port){
 if(port===undefined)port=cfg.printerPort;
 const url=eposBase(port)+'/cgi-bin/epos/service.cgi?devid=local_printer&timeout=10000';
 const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),12000);
 try{
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/xml; charset=utf-8','SOAPAction':'""'},body:xml,signal:ctl.signal});
  const txt=await r.text();if(!/success="true"/.test(txt))throw new Error('Printer replied with an error');
 }finally{clearTimeout(t)}
}
function htmlPrint(lines){

 $('#printArea').innerHTML='<pre>'+lines.map(l=>h(l.align==='center'?' '.repeat(Math.max(0,Math.floor((W-l.text.length)/2)))+l.text:l.text)).join('\n')+'</pre>';

async function probePrinter(port){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),6000);
 try{await fetch(eposBase(port)+'/',{mode:'no-cors',cache:'no-store',signal:ctl.signal});return 'ok'}catch(e){return e.name==='AbortError'?'timeout':'fail'}finally{clearTimeout(t)}}
async function printerProblem(e,port){
 const where=cfg.printerIp+(port?':'+port:'');
 if(e&&/Printer replied/.test(e.message||''))return 'D: The printer answered but did not print. Check the paper and that the cover is shut.';
 if(e&&e.name==='AbortError')return 'C: No answer from the printer at '+where+'. Check the IP address and port.';
 const p=await probePrinter(port);
 if(p==='ok')return 'B: The iPad reaches the printer at '+where+' securely, but the printer refused the print request.';
 if(p==='timeout')return 'C: No answer from the printer at '+where+'. Check the IP address and port.';

}

A.alSignIn=async()=>{
 if(alBusy)return;const email=($('#al_email').value||'').trim(),pw=$('#al_pw').value||'';
 if(!email||!pw)return toast('Enter your email and password',true);
 AL.email=email;alBusy=true;
 try{
  toast('Signing in…');
  const tmp=sessOf(await authReq('token?grant_type=password',{email,password:pw}));
  const row=await roleOf(tmp.access_token,tmp.user.id);
  if(row.role!=='admin')throw new Error(row.role==='till'?'That is the till account. Use your own admin login.':'This account is not an admin');
  tmp.name=row.name||email;
  const u=await authReq('user',undefined,tmp.access_token);
  const f=(u.factors||[]).find(x=>x.factor_type==='totp'&&x.status==='verified');
  AL.tmp=tmp;
  if(f){AL.factorId=f.id;AL.step='code'}
  else{
   for(const x of (u.factors||[]).filter(x=>x.status!=='verified'))try{await authReq('factors/'+x.id,undefined,tmp.access_token,'DELETE')}catch(e){}
   const e=await authReq('factors',{factor_type:'totp',friendly_name:'Cash POS '+Date.now().toString(36),issuer:'Dakabin Cash POS'},tmp.access_token);
   AL.factorId=e.id;AL.qr=e.totp&&e.totp.qr_code;AL.secret=e.totp&&e.totp.secret;AL.uri=e.totp&&e.totp.uri;AL.step='enroll';
  }
  alRedraw();
 }catch(e){toast(/invalid login|invalid_credentials|invalid grant/i.test(e.message)?'Wrong email or password':e.message,true)}
 alBusy=false;
};
A.alVerify=async()=>{

 if(code.length!==6)return toast('Enter the 6-digit code',true);
 alBusy=true;
 try{
  const c=await authReq('factors/'+AL.factorId+'/challenge',{},AL.tmp.access_token);
  const S=sessOf(await authReq('factors/'+AL.factorId+'/verify',{challenge_id:c.id,code},AL.tmp.access_token));
  if(!S.user.id)S.user=AL.tmp.user;S.name=AL.tmp.name;
  if(jwtClaims(S.access_token).aal!=='aal2')throw new Error('2-step check did not complete. Try again.');
  setSess('admin',S);const cb=AL.cb;AL={step:'cred'};
  if(cfg.mode==='till')closeModal();
  syncSoon();
  if(cb)cb();else render();
 }catch(e){toast(/invalid|expired|mismatch/i.test(e.message)?'Code not accepted. Wait for a fresh code and try again.':e.message,true)}
 alBusy=false;
};

const cashDiscPct=()=>{const v=cfg&&cfg.cashDisc;return v==null||v===''?2:Math.max(0,Math.min(50,+v||0))};

 const sub=bill.lines.reduce((a,l)=>a+l.price*l.qty,0);let disc=0;
 const D=effDisc();if(D)disc=D.type==='pct'?Math.round(sub*D.value/100):Math.min(D.value,sub);

 const taxable=bill.lines.filter(l=>l.gst!==false).reduce((a,l)=>a+l.price*l.qty,0),gst=Math.round(taxable*(sub?pre/sub:0)/11);

 return {sub,disc,pre,total,rounding:total-pre,gst,count,exGst:pre-gst};
}

 s.refunds.push(r);s.refunded+=amt;s.status=s.lines.every((l,i)=>refQty(s,i)>=l.qty)?'refunded':'partial';s.rev=(s.rev||1)+1;

async function loadXLSX(){if(window.XLSX)return;await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('Could not load the importer. Check the internet connection.'));document.head.appendChild(s)})}
function fixMoji(t){t=String(t);if(!/[\u00C2\u00C3][\u0080-\u00BF]/.test(t))return t;try{return decodeURIComponent(escape(t))}catch(e){return t}}
async function importFile(file){
 if(!file)return;
 try{
  toast('Reading the file…');await loadXLSX();
  const isCsv=/\.csv$/i.test(file.name||'')||/csv/i.test(file.type||'');const wb=isCsv?XLSX.read((await file.text()).replace(/^\uFEFF/,''),{type:'string'}):XLSX.read(await file.arrayBuffer(),{type:'array'});
  let rows=null,hi=-1;
  for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});const i=r.findIndex((row,k)=>k<15&&row.some(c=>/^item name$/i.test(String(c).trim())));if(i>=0){rows=r;hi=i;break}}
  if(!rows)throw new Error('This doesn\'t look like a Square item export. No "Item Name" column found.');
  const H=rows[hi].map(c=>String(c).trim().toLowerCase());
  const col=(...res)=>{for(const re of res){const i=H.findIndex(x=>re.test(x));if(i>=0)return i}return -1};
  const ci=col(/^item name$/),cv=col(/^variation name$/),cp=col(/^price$/,/^price\b/),cc=col(/^reporting category$/,/^categories$/,/^category$/,/categor/),ca=col(/^archived$/),cg=col(/gst/,/^tax/);
  if(cp<0)throw new Error('No Price column found in the file.');
  const map=new Map(),catOrder=[];
  let rowNo=hi+1;

 return {count:ds.length,product:ds.reduce((x,s)=>x+s.subtotal,0),disc:ds.reduce((x,s)=>x+(s.discount?s.discount.amount:0),0),cashIn,cashOut,refundCount:refunds.length,expected:cashIn-cashOut};

async function restoreFile(file){

  const b=JSON.parse(await file.text());if(b.app!=='dakabin-cash-pos'||!b.catalog||!b.staff||!Array.isArray(b.sales))throw new Error('That is not a Cash POS backup file.');
  if(!confirm(`Restore the backup from ${fmtDT(b.exported)}?\n\nItems, categories and team are replaced. ${b.sales.length} sales are merged with the ones on this iPad.`))return;
  catalog=cleanCatalog(b.catalog);catalog.updated=Date.now();staff=cleanStaff(b.staff);staff.updated=Date.now();
  const byId=new Map(sales.map(s=>[s.id,s]));for(const raw of b.sales){const s=cleanSale(raw);if(!s)continue;const o=byId.get(s.id);if(!o){s.rev=(s.rev||1);s.syncedRev=0;byId.set(s.id,s)}else if(mergeRefunds(o,s))o.rev=(o.rev||1)+1}
  sales=[...byId.values()].sort((x,y)=>x.at<y.at?-1:1);
  const ek=new Set(eods.map(e=>e.at));for(const e of b.eods||[])if(!ek.has(e.at))eods.push(e);
  LS.set('catalog',catalog);LS.set('staff',staff);saveSales();LS.set('eods',eods);

/* ---------- reports ---------- */
function periodOf(key,now=new Date()){
 const d0=sod(now),y=now.getFullYear(),m=now.getMonth();let start,end,ps,pe;
 if(key==='today'){start=d0;end=addDays(d0,1);ps=addDays(d0,-7);pe=addDays(ps,1)}
 else if(key==='week'){start=addDays(d0,-((d0.getDay()+6)%7));end=addDays(start,7);ps=addDays(start,-7);pe=start}
 else if(key==='month'){start=new Date(y,m,1);end=new Date(y,m+1,1);ps=new Date(y,m-1,1);pe=start}
 else if(key==='quarter'){const q=m-m%3;start=new Date(y,q,1);end=new Date(y,q+3,1);ps=new Date(y,q-3,1);pe=start}
 else{start=new Date(y,0,1);end=new Date(y+1,0,1);ps=new Date(y-1,0,1);pe=start}
 let cut=new Date(ps.getTime()+(now-start));if(cut>pe)cut=pe;
 return {key,start,end,now,ps,pe,cut};
}
function bucketsOf(P){
 const MN=['J','F','M','A','M','J','J','A','S','O','N','D'],MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 if(P.key==='today'){const hs=[];for(let i=5;i<=19;i++)hs.push(i);return {labels:hs.map(x=>x%3===2?(x%12||12)+(x<12?'am':'pm'):''),idx:d=>Math.min(hs.length-1,Math.max(0,d.getHours()-5))}}
 if(P.key==='week')return {labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],idx:(d,b)=>Math.round((sod(d)-b)/864e5)};
 if(P.key==='month')return {labels:Array.from({length:31},(_,i)=>(i+1)%5===1?String(i+1):''),idx:d=>d.getDate()-1};
 if(P.key==='quarter')return {labels:[0,1,2].map(i=>MS[(P.start.getMonth()+i)%12]),idx:(d,b)=>(d.getFullYear()*12+d.getMonth())-(b.getFullYear()*12+b.getMonth())};
 return {labels:MN,idx:d=>d.getMonth()};
}
function metrics(list,evs){
 let gross=0,disc=0,col=0;for(const s of list){gross+=s.subtotal;disc+=s.discount?s.discount.amount:0;col+=s.total}const ref=evs.reduce((a,r)=>a+r.amount,0);
 const net=gross-disc-ref;return {gross,disc,ref,net,count:list.length,avg:list.length?Math.round(net/list.length):0,col};
}
function tops(list,by){const m={};for(const s of list)for(const l of s.lines){const k=by==='item'?l.name.replace(/ \(.*\)$/,''):(l.catName||'Other');m[k]=m[k]||{gross:0,count:0};m[k].gross+=l.price*l.qty;m[k].count+=l.qty}return Object.entries(m)}
function pct(a,b){if(!b)return '';const p=(a-b)/Math.abs(b)*100;return `<div class="c ${p>=0?'up':'down'}">${p>=0?'+':''}${p.toFixed(2)}%</div>`}
function chartSVG(cur,prev,labels){
 const W=700,H=250,L=58,B=26,T=10,pw=W-L-10,ph=H-B-T,n=labels.length,max0=Math.max(1,...cur,...prev);
 const step=[100,200,500,1000,2000,5000,10000,20000,50000,100000,200000,500000,1000000].find(s=>s*5>=max0)||Math.ceil(max0/5);const max=step*5;
 let g='';for(let i=0;i<=5;i++){const y=T+ph-ph*i/5;g+=`<line x1="${L}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#e2e4e7"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="12" fill="#666d75">$${(step*i/100).toLocaleString('en-AU')}</text>`}
 const gw=pw/n,bw=Math.max(2,gw*0.38);
 for(let i=0;i<n;i++){const x=L+gw*i+gw*0.12;const hc=ph*cur[i]/max,hp=ph*prev[i]/max;
  g+=`<rect x="${x}" y="${T+ph-hc}" width="${bw}" height="${hc}" fill="#62a0ff"/><rect x="${x+bw}" y="${T+ph-hp}" width="${bw}" height="${hp}" fill="#a3aab1"/>`;
  if(labels[i])g+=`<text x="${x+bw}" y="${H-8}" text-anchor="middle" font-size="12" fill="#666d75">${labels[i]}</text>`}
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Product sales compared with the previous period">${g}</svg>`;
}
function refundEvents(list){const m=new Map();for(const s of list)for(const r of s.refunds||[])m.set(r.id,r);return [...m.values()]}
function repHTML(curAll,prevAll,P,refundSrc){
 const evAll=refundEvents(refundSrc||curAll.concat(prevAll)),inR=(r,a,b)=>{const d=new Date(r.at);return d>=a&&d<b};
 const evCur=evAll.filter(r=>inR(r,P.start,P.end)),evPrev=evAll.filter(r=>inR(r,P.ps,P.cut));
 const cur=curAll.filter(s=>{const d=new Date(s.at);return d>=P.start&&d<P.end});
 const prevFull=prevAll.filter(s=>{const d=new Date(s.at);return d>=P.ps&&d<P.pe});
 const prev=prevFull.filter(s=>new Date(s.at)<P.cut);
 const m=metrics(cur,evCur),pm=metrics(prev,evPrev),B=bucketsOf(P);
 const cv=B.labels.map(()=>0),pv=B.labels.map(()=>0);
 cur.forEach(s=>{const i=B.idx(new Date(s.at),P.start);if(i>=0&&i<cv.length)cv[i]+=s.subtotal});
 prevFull.forEach(s=>{const i=B.idx(new Date(s.at),P.ps);if(i>=0&&i<pv.length)pv[i]+=s.subtotal});
 const today=P.key==='today';
 const head=today?fmtD(P.start):`${fmtDs(P.start)} - ${fmtD(addDays(P.end,-1))}`;
 const vs=today?`vs. ${fmtD(P.ps)} (up to ${fmtT(P.now)})`:`vs. ${fmtDs(P.ps)} - ${fmtD(P.cut>P.ps?new Date(P.cut-1):P.ps)}`;
 const prevName={today:'Previous '+P.ps.toLocaleDateString('en-AU',{weekday:'long'}),week:'Previous week',month:'Previous month',quarter:'Previous quarter',year:'Previous year'}[P.key];
 const topList=(by,mode)=>{const t=tops(cur,by).sort((a,b)=>b[1][mode]-a[1][mode]).slice(0,8);return t.length?t.map(([k,v])=>`<div class="li"><span>${h(k)}</span><span>${mode==='gross'?money(v.gross):v.count}</span></div>`).join(''):'<p class="mute">No sales in this period.</p>'};
 const seg=(k)=>`<div class="seg"><button class="${V[k]==='gross'?'on':''}" data-a="seg" data-v="${h(k)}:gross">Gross</button><button class="${V[k]==='count'?'on':''}" data-a="seg" data-v="${h(k)}:count">Count</button></div>`;
 const team={};cur.forEach(s=>{team[s.staffName]=(team[s.staffName]||0)+s.subtotal-(s.discount?s.discount.amount:0)});
 const refundsOut=m.ref;
 return `<div class="rep"><div class="rephead"><div class="d">${head}</div><div class="v">All team, cash only, ${vs}</div></div>
 <div class="tabs">${[['today','Today'],['week','Week'],['month','Month'],['quarter','Quarter'],['year','Year']].map(([k,l])=>`<button class="${P.key===k?'on':''}" data-a="rep" data-v="${h(k)}">${l}</button>`).join('')}</div>
 <div class="sec"><h4>SALES SUMMARY</h4><div class="kpis">
 <div class="kpi"><div class="n">${money(m.gross)}</div><div class="l">Product Sales</div>${pct(m.gross,pm.gross)}</div>
 <div class="kpi"><div class="n">${money(m.net)}</div><div class="l">Net Sales</div>${pct(m.net,pm.net)}</div>
 <div class="kpi"><div class="n">${m.count}</div><div class="l">Sales</div>${pct(m.count,pm.count)}</div>
 <div class="kpi"><div class="n">${money(m.avg)}</div><div class="l">Average Sale</div>${pct(m.avg,pm.avg)}</div>
 <div class="kpi"><div class="n">${m.ref?'('+money(m.ref)+')':'$0.00'}</div><div class="l">Returns + Refunds</div></div>
 <div class="kpi"><div class="n">${m.disc?'('+money(m.disc)+')':'$0.00'}</div><div class="l">Discounts</div></div></div></div>
 <div class="sec"><h4>PRODUCT SALES</h4><div class="cmp"><div class="cur"><span class="mute">${today?fmtD(P.start):'This period'}</span><b>${money(m.gross)}</b></div><div><span class="mute">${prevName}</span><b>${money(pv.reduce((a,b)=>a+b,0))}</b></div></div>${chartSVG(cv,pv,B.labels)}</div>
 <div class="sec"><h4>CASH</h4><div class="li"><span>Cash taken</span><span>${money(m.col)}</span></div><div class="li"><span>Cash refunded</span><span>${money(-refundsOut)}</span></div><div class="li"><span>Net cash</span><span>${money(m.col-refundsOut)}</span></div></div>
 <div class="sec"><h4>TOP ITEMS</h4>${seg('repItems')}${topList('item',V.repItems)}</div>
 <div class="sec"><h4>TOP CATEGORIES</h4>${seg('repCats')}${topList('cat',V.repCats)}</div>
 <div class="sec"><h4>BY TEAM MEMBER (after discounts)</h4>${Object.keys(team).length?Object.entries(team).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="li"><span>${h(k)}</span><span>${money(v)}</span></div>`).join(''):'<p class="mute">No sales in this period.</p>'}</div>
 <div class="sec"><h4>RECENT SALES</h4>${cur.slice(-10).reverse().map(s=>`<div class="li"><span>${fmtT(s.at)}, ${h(s.staffName)}${s.status!=='complete'?' <span class="badge">refund</span>':''}</span><span>${money(s.total)}</span></div>`).join('')||'<p class="mute">No sales in this period.</p>'}</div></div>`;
}
function tillRepHTML(){const P=periodOf(V.rep);return `<h2 class="ttl">Reports</h2>`+repHTML(sales,sales,P,sales)}
A.rep=v=>{V.rep=v;render()};
A.seg=v=>{const [k,val]=v.split(':');V[k]=val;render()};

/* ---------- viewer (iPhones) ---------- */
let VD={key:null,cur:[],prev:[],ref:[],at:0,loading:false,err:''};
async function ensureViewerData(force){
 if(VD.loading)return;if(!force&&VD.key===V.rep&&Date.now()-VD.at<60000)return;
 VD.loading=true;const key=V.rep,P=periodOf(key);
 try{const [cur,prev,ref]=await Promise.all([fetchRange(P.start,P.end),fetchRange(P.ps,P.pe),sb(`cash_sales?select=data&status=neq.complete&updated_at=gte.${encodeURIComponent(P.ps.toISOString())}&limit=5000`)]);VD={key,cur,prev,ref:(ref||[]).map(r=>r.data),at:Date.now(),loading:false,err:''};syncState='ok'}
 catch(e){VD.loading=false;VD.err=e.message;syncState=navigator.onLine?'err':'offline';if(!ADMIN){render();return}}
 if(ADMIN&&cfg.mode==='viewer'&&!MODAL&&V.screen==='rep'){const sc=($('.viewer')||{}).scrollTop||0;$('#app').innerHTML=viewerHTML();const v=$('.viewer');if(v)v.scrollTop=sc;if(VD.key!==V.rep)ensureViewerData()}
}
let VT={days:7,list:[],loading:false,err:'',loadedDays:0};
function findSale(id){return sales.find(x=>x.id===id)||VT.list.find(x=>x.id===id)}
function vtxRows(){const q=(V.txQ||'').toLowerCase().replace('$','');let l=VT.list;if(q)l=l.filter(x=>x.no.toLowerCase().includes(q)||(x.total/100).toFixed(2).includes(q)||x.staffName.toLowerCase().includes(q));return txRowsOf(l.slice(0,400))}
function vtxHTML(){return `<h2 class="ttl">Sales</h2><div class="chips" style="margin-bottom:12px">${[7,30,90].map(d=>`<button class="chip ${VT.days===d?'on':''}" data-a="vtxDays" data-v="${d}">Last ${d} days</button>`).join('')}</div>
 <div class="bar"><input class="search" style="width:100%" type="search" placeholder="Receipt, amount or name" value="${h(V.txQ||'')}" oninput="V.txQ=this.value.trim();document.getElementById('txl').innerHTML=vtxRows()"></div>
 ${VT.err?`<p class="down">Could not load: ${h(VT.err)} <button class="link" data-a="vtxDays" data-v="${VT.days}">Try again</button></p>`:(VT.loading&&!VT.list.length?'<p class="mute">Loading sales…</p>':'')}
 <div id="txl">${vtxRows()}</div>`}
A.vtxDays=v=>{VT.days=+v;VT.err='';VT.list=[];VT.loadedDays=0;render()};
async function loadTx(){
 if(VT.loading)return;VT.loading=true;const days=VT.days;
 try{const a=addDays(sod(new Date()),-(days-1)),b=addDays(sod(new Date()),1);const l=await fetchRange(a,b);VT.list=l.map(cleanSale).filter(Boolean).reverse();VT.err='';VT.loadedDays=days;syncState='ok'}
 catch(e){VT.err=e.message;VT.loadedDays=days}
 VT.loading=false;
 if(cfg.mode==='viewer'&&ADMIN&&!MODAL&&V.screen==='tx'){const sc=($('.viewer')||{}).scrollTop||0;$('#app').innerHTML=viewerHTML();const v=$('.viewer');if(v)v.scrollTop=sc}
}
function kvGate(){return V.kvErr?`<p class="down">Could not load the latest data: ${h(V.kvErr)}</p><button class="btn" data-a="vgo" data-v="${h(V.screen)}">Try again</button>`:'<p class="mute" style="text-align:center;margin-top:40px">Loading the latest items, team and settings…</p>'}
function viewerHTML(){
 if(V.screen==='settings')return `<div class="viewer"><div class="vhead"><button class="round" data-a="vBack" aria-label="Back">←</button><span class="t">Settings</span></div>${V.kvOk?settingsScreenHTML():kvGate()}</div>`;
 const tabs=[['rep','Reports'],['tx','Sales'],['items','Items'],['staff','Team'],['data','Data']];
 const head=`<div class="vhead"><span class="t">${h(cfg.biz||'Dakabin Bakehouse')}</span>${V.screen==='rep'?'<button class="btn" data-a="vRefresh">Refresh</button>':`<button class="sync ${syncState}" id="sync" data-a="syncNowBtn">${syncLabel()}</button>`}<button class="btn" data-a="lock">Sign out</button></div>
 <div class="tabs">${tabs.map(([k,l])=>`<button class="${V.screen===k?'on':''}" data-a="vgo" data-v="${k}">${l}</button>`).join('')}</div>`;
 let body;
 if(V.screen==='rep'){
  const ready=VD.key===V.rep;
  body=`${VD.err?`<p class="down">Could not load: ${h(VD.err)}</p>`:''}
 ${ready?repHTML(VD.cur,VD.prev,periodOf(V.rep),VD.cur.concat(VD.prev,VD.ref)):'<p class="mute" style="text-align:center;margin-top:40px">Loading sales…</p>'}
 <p class="mute" style="text-align:center">${VD.at?'Updated '+fmtT(VD.at)+'. Refreshes every minute. ':''}<button class="link" data-a="go" data-v="settings">Settings</button></p>`;
 }else if(V.screen==='tx')body=vtxHTML();
 else if(!V.kvOk)body=kvGate();
 else if(V.screen==='items')body=itemsHTML();
 else if(V.screen==='staff')body=staffHTML();
 else body=dataHTML();
 return `<div class="viewer">${head}${body}</div>`;
}
let kvLoading=false;
async function loadKV(){
 if(kvLoading||V.kvOk)return;kvLoading=true;
 try{await pullKV();V.kvOk=true;V.kvErr=''}catch(e){V.kvErr=e.message}
 kvLoading=false;
 if(cfg.mode==='viewer'&&ADMIN&&!MODAL&&!['rep','tx'].includes(V.screen))render();
}
A.vgo=v=>{V.screen=v;V.kvErr='';if(v==='tx')VT.loadedDays=0;render()};
A.vRefresh=()=>{ensureViewerData(true);toast('Refreshing…')};
A.vBack=()=>{V.screen='rep';render()};

/* ---------- render & wiring ---------- */
const ADMIN_SCREENS=['items','rep','staff','settings'];
function screenHTML(){
 if(ADMIN_SCREENS.includes(V.screen)&&!isAdmin())V.screen='menu';
 if(V.screen==='eod'&&!(isMgr()||isAdmin()))V.screen='menu';
 switch(V.screen){
  case 'tx':return txHTML();case 'items':return itemsHTML();case 'rep':return tillRepHTML();case 'more':return moreHTML();
  case 'eod':return eodHTML();case 'staff':return staffHTML();case 'settings':return settingsScreenHTML();default:return menuHTML();
 }
}
function tillHTML(){
 const adm=isAdmin(),nav=[['menu','Menu'],['tx','Transactions']].concat(adm?[['items','Items'],['rep','Reports']]:[]).concat([['more','More']]);
 return `<div class="till"><main class="main" id="main">${screenHTML()}</main>${V.screen==='menu'?cartbarHTML():''}${billHTML()}
 <nav class="nav">${nav.map(([k,l])=>`<button class="${V.screen===k||(k==='more'&&['eod','staff','settings'].includes(V.screen))?'on':''}" data-a="go" data-v="${h(k)}">${l}</button>`).join('')}<span class="who">${h(user.name)}${adm&&!localMode()?', admin':(user.role==='manager'?', manager':'')} <button class="link" data-a="lock">Lock</button></span></nav></div>`;
}
function gateHTML(){return `<div class="center"><div class="form" style="text-align:center"><div class="brand">${h((cfg&&cfg.biz)||'Dakabin Bakehouse')}</div>
 <h1 style="margin-top:18px">Add to Home Screen first</h1><p>Safari and the home-screen app keep separate data, so this only runs from the icon.</p>
 <p>Tap the Share button, then <b>Add to Home Screen</b>, then open the new icon.</p>
 <p style="margin-top:28px"><button class="link" data-a="ungate">Use in Safari anyway (testing only)</button></p></div></div>`}
A.ungate=()=>{sessionStorage.setItem('cpos_ungate','1');render()};
function ensureCatOrder(){if(!catalog||!Array.isArray(catalog.cats)||catalog.cats.length<2)return;const o=catalog.cats.map((c,i)=>[c,i]).sort((a,b)=>catRank(a[0].name)-catRank(b[0].name)||a[1]-b[1]).map(x=>x[0]);if(o.some((c,i)=>c!==catalog.cats[i]))catalog.cats=o}
function render(){
 ensureCatOrder();
 const app=$('#app');
 if(navigator.standalone===false&&!sessionStorage.getItem('cpos_ungate')&&window.top===window.self){app.innerHTML=gateHTML();return}
 if(!cfg||V.setup){app.innerHTML=setupHTML();return}
 if(cfg.mode==='viewer'){
  if(!ADMIN){AL.modal=false;app.innerHTML=`<div class="center"><div class="form"><div class="brand">${h(cfg.biz||'Dakabin Bakehouse')}</div><p class="mute">Reports, items, team and backup</p>${adminFormHTML()}<p style="margin-top:20px"><button class="link" data-a="openSetup">Device settings</button></p></div></div>`;return}
  if(!['rep','tx','items','staff','data','settings'].includes(V.screen))V.screen='rep';app.innerHTML=viewerHTML();
  if(V.screen==='rep')ensureViewerData();else if(V.screen==='tx'){if(VT.loadedDays!==VT.days&&!VT.loading)loadTx()}else if(!V.kvOk&&!V.kvErr)loadKV();return;
 }
 if(!localMode()&&!TILL){app.innerHTML=connectHTML();return}
 if(!staff.list.some(s=>s.role==='manager')){app.innerHTML=(localMode()||ADMIN)?firstManagerHTML():adminNeededHTML();return}
 if(!user){app.innerHTML=loginHTML();return}
 app.innerHTML=tillHTML();
}
A.go=v=>{const open=()=>{V.screen=v;if(v==='menu'){V.cat=null;V.q=''}render();const mn=$('#main');if(mn)mn.scrollTop=0};if(cfg&&cfg.mode==='till'&&ADMIN_SCREENS.includes(v)&&!isAdmin())return requireAdmin(open);open()};
if(window.matchMedia){const mq=window.matchMedia('(max-width:600px)');const ch=()=>{if(typeof user!=='undefined'&&user&&!MODAL)render()};if(mq.addEventListener)mq.addEventListener('change',ch);else if(mq.addListener)mq.addListener(ch)}
document.addEventListener('click',e=>{if(ADMIN&&cfg&&cfg.mode==='till')adminSeen=Date.now();const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset.v,el)}});
window.addEventListener('online',()=>syncNow());
window.addEventListener('storage',e=>{if(!e.key||!e.key.startsWith('cpos_'))return;sales=LS.get('sales',[]);catalog=cleanCatalog(LS.get('catalog',catalog));staff=cleanStaff(LS.get('staff',staff));bill=LS.get('bill',{lines:[],discount:null});if(!MODAL&&user)render()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg){syncNow();if(cfg.mode==='viewer'&&ADMIN)ensureViewerData(true)}});
setInterval(()=>{if(cfg&&cfg.mode==='till')syncNow()},30000);
setInterval(()=>{if(cfg&&cfg.mode==='viewer'&&ADMIN&&!document.hidden&&V.screen==='rep')ensureViewerData(true)},60000);
setInterval(()=>{if(cfg&&cfg.mode==='till'&&ADMIN&&Date.now()-adminSeen>ADMIN_IDLE){adminSignOut();if(['items','rep','staff','settings'].includes(V.screen))V.screen='menu';toast('Admin signed out after 15 minutes idle');if(!MODAL)render()}},30000);
render();
if(cfg)syncNow();

</script>
</body>
</html>
